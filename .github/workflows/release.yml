name: release

# Trusted publishing (OIDC), no API token. PyPI needs a trusted publisher for
# owner anarkiwi, repository kimdos, workflow release.yml, environment pypi.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y cc65
      - run: pip install -e .
      - run: docker pull "$(sed -n 's/^FROM //p' src/kimdos/c/Dockerfile)"
      - run: make images && make clib
      - name: collect
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          mkdir dist
          git archive --format=tar.gz --prefix="kimdos-c-$version/" --add-file=LICENSE -o "dist/kimdos-c-$version.tar.gz" HEAD:src/kimdos/c
          cp src/kimdos/images/* build/c/libkimdos.a src/kimdos/c/include/kimdos.h dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: images
          path: dist/
      - name: attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --clobber

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y cc65
      - run: pip install build twine "kimtape>=0.1.1"
      - run: make images
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python tools/check_dist.py dist
      - name: tag matches version
        if: github.event_name == 'release'
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "${GITHUB_REF_NAME#v}" = "$version"
      - name: wheel installs and runs
        run: |
          pip install dist/*.whl
          kimdos --help
          ls "$(python -m kimdos.clib)/include/kimdos.h"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kimdos/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
