name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      - name: black
        run: black --check --diff src tests tools
      - name: pylint
        run: pylint src/kimdos tests tools
      - name: clang-format
        run: clang-format --dry-run --Werror --style=LLVM src/kimdos/c/include/*.h src/kimdos/c/src/*.[ch] src/kimdos/c/test/*.c

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: sudo apt-get install -y cc65
      - run: pip install -e ".[dev]"
      - run: docker pull "$(sed -n 's/^FROM //p' src/kimdos/c/Dockerfile)"
      - run: make images && make clib
      - name: pytest
        run: pytest -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: sudo apt-get install -y cc65
      - run: pip install build twine "kimtape>=0.1.1"
      - run: make images
      - run: python -m build
      - run: twine check --strict dist/*
      - run: python tools/check_dist.py dist
      - name: wheel installs and runs
        run: |
          pip install dist/*.whl
          kimdos --help
          ls "$(python -m kimdos.clib)/include/kimdos.h"
