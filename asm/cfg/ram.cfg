# One RAM-resident image at __ORG__: code, initialised data, then BSS.
SYMBOLS {
    __ORG__: type = weak, value = $2000;
}
MEMORY {
    RAM: file = %O, start = __ORG__, size = $10000 - __ORG__, define = yes;
}
SEGMENTS {
    CODE: load = RAM, type = ro;
    RODATA: load = RAM, type = ro, optional = yes;
    DATA: load = RAM, type = rw;
    BSS: load = RAM, type = bss, define = yes;
}
